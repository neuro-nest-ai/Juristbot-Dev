server {
    listen 80;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files if present, otherwise fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Example: proxy API requests to backend service in the cluster
    # adjust service name / port as needed or remove if you don't proxy from same pod
    location /api/ {
        proxy_pass http://juristbot-api-svc.juristbot-prod.svc.cluster.local:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: don't reveal nginx version, and fine tune timeouts if you like
    server_tokens off;
}
