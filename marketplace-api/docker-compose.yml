services:
  mysql:
    image: mysql:8.0
    container_name: marketplace-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: marketplace_db
    ports:
      - "3306:3306"
    volumes:
      - marketplace_mysql_data:/var/lib/mysql

volumes:
  marketplace_mysql_data:
